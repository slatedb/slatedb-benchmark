name: Run benchmarks

on:
  workflow_dispatch:
    inputs:
      slatedb_ref:
        description: SlateDB tag, branch, or commit to benchmark
        required: true
        default: main
        type: string
      golden_id:
        description: Existing golden data name
        required: true
        default: golden
        type: string
      object_store:
        description: Object store
        required: true
        default: s3
        type: choice
        options:
          - s3
          - tigris
      scale:
        description: Decimal scale factor
        required: true
        default: "1.0"
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: slatedb-benchmark-${{ inputs.object_store }}-environment
  cancel-in-progress: false

jobs:
  validate-golden:
    runs-on: ubuntu-latest
    environment: benchmark-${{ inputs.object_store }}
    outputs:
      started_at: ${{ steps.validate.outputs.started_at }}
    steps:
      - name: Summarize workflow inputs
        shell: bash
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
        run: |
          {
            echo "### Workflow inputs"
            echo
            echo "| Input | Value |"
            echo "| --- | --- |"
            jq -r '
              to_entries[]
              | "| `\(.key)` | `\(.value | tostring | gsub("\\|"; "\\\\|"))` |"
            ' <<< "$WORKFLOW_INPUTS"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure S3 credentials
        if: ${{ inputs.object_store == 's3' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure Tigris credentials
        if: ${{ inputs.object_store == 'tigris' }}
        shell: bash
        env:
          AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${TIGRIS_ACCESS_KEY_ID:?Tigris access key ID is required}"
          : "${TIGRIS_SECRET_ACCESS_KEY:?Tigris secret access key is required}"
          {
            echo "AWS_ACCESS_KEY_ID=$TIGRIS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$TIGRIS_SECRET_ACCESS_KEY"
            echo "AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3:-https://t3.storage.dev}"
          } >> "$GITHUB_ENV"
      - name: Fetch golden manifest
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          GOLDEN_ID: ${{ inputs.golden_id }}
          SLATEDB_BENCH_BUCKET: ${{ vars.SLATEDB_BENCH_BUCKET }}
        run: |
          set -euo pipefail
          bucket=${SLATEDB_BENCH_BUCKET:?SLATEDB_BENCH_BUCKET is required}
          prefix=${SLATEDB_BENCH_PREFIX:-benchmark}
          mkdir -p .runs/bundle
          aws s3 cp --only-show-errors \
            "s3://$bucket/$prefix/goldens/$GOLDEN_ID/golden.json" \
            .runs/bundle/golden.json
      - name: Validate golden manifest
        id: validate
        shell: bash
        env:
          BENCHMARK_SCALE: ${{ inputs.scale }}
          GH_TOKEN: ${{ github.token }}
          GOLDEN_ID: ${{ inputs.golden_id }}
          OBJECT_STORE: ${{ inputs.object_store }}
        run: |
          set -euo pipefail
          manifest=.runs/bundle/golden.json
          jq -e --arg golden "$GOLDEN_ID" \
            '.status == "ok"
              and .golden_id == $golden
              and .configuration.task.task == "compaction"
              and (.checkpoint | type == "object")
              and (.dataset | type == "object")' "$manifest" >/dev/null
          jq -e --arg object_store "$OBJECT_STORE" \
            '.environment.object_store == $object_store' "$manifest" >/dev/null
          jq -e --argjson scale "$BENCHMARK_SCALE" \
            '.configuration.scale == $scale' "$manifest" >/dev/null
          started_at=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq .created_at)
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: golden-manifest
          path: .runs/bundle/golden.json
          if-no-files-found: error
          overwrite: true

  build:
    runs-on: warp-ubuntu-latest-arm64-16x
    outputs:
      workloads: ${{ steps.catalog.outputs.workloads }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: slatedb/slatedb
          ref: ${{ inputs.slatedb_ref }}
          path: .slatedb-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Apply SlateDB patches
        run: bash scripts/apply-slatedb-patch.sh .slatedb-source
      - name: Resolve SlateDB source
        id: source
        shell: bash
        env:
          SLATEDB_REF: ${{ inputs.slatedb_ref }}
        run: |
          set -euo pipefail
          commit=$(git -C .slatedb-source rev-parse HEAD)
          if [[ "$SLATEDB_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            version=${SLATEDB_REF#v}
          else
            version=sha-${commit:0:12}
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Configure selected SlateDB source
        shell: bash
        run: |
          set -euo pipefail
          cargo add --quiet --path "$GITHUB_WORKSPACE/.slatedb-source/slatedb" \
            --no-default-features --features aws,foyer,wal_disable,zstd
          cargo add --quiet --path "$GITHUB_WORKSPACE/.slatedb-source/slatedb-common" \
            --features serde
      - name: Build runner
        env:
          SLATEDB_COMMIT: ${{ steps.source.outputs.commit }}
          SLATEDB_VERSION: ${{ steps.source.outputs.version }}
        run: cargo build --release --locked
      - name: Export workload catalog
        id: catalog
        shell: bash
        run: echo "workloads=$(target/release/slatedb-benchmark catalog)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-runner
          path: target/release/slatedb-benchmark
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  workloads:
    needs: [validate-golden, build]
    runs-on: warp-ubuntu-latest-arm64-32x
    timeout-minutes: 1440
    environment: benchmark-${{ inputs.object_store }}
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.build.outputs.workloads) }}
    concurrency:
      group: session-${{ github.run_id }}-${{ matrix.task }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-runner
          path: bin
      - run: chmod +x bin/slatedb-benchmark
      - name: Configure S3 credentials
        if: ${{ inputs.object_store == 's3' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure Tigris credentials
        if: ${{ inputs.object_store == 'tigris' }}
        shell: bash
        env:
          AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${TIGRIS_ACCESS_KEY_ID:?Tigris access key ID is required}"
          : "${TIGRIS_SECRET_ACCESS_KEY:?Tigris secret access key is required}"
          {
            echo "AWS_ACCESS_KEY_ID=$TIGRIS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$TIGRIS_SECRET_ACCESS_KEY"
            echo "AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3:-https://t3.storage.dev}"
          } >> "$GITHUB_ENV"
      - name: Run ${{ matrix.task }}
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          BENCHMARK_ACTIONS_JOB_ID: ${{ job.check_run_id }}
          BENCHMARK_SCALE: ${{ inputs.scale }}
          BENCHMARK_SESSION: github-${{ github.run_id }}
          BENCHMARK_TASK: ${{ matrix.task }}
          CLOUD_PROVIDER: ${{ inputs.object_store }}
          GOLDEN_ID: ${{ inputs.golden_id }}
          SLATEDB_BENCH_BUCKET: ${{ vars.SLATEDB_BENCH_BUCKET }}
          SLATEDB_BENCH_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          export BENCHMARK_ACTIONS_LOG_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/job/$BENCHMARK_ACTIONS_JOB_ID"
          unset BENCHMARK_ACTIONS_JOB_ID
          : "${SLATEDB_BENCH_BUCKET:?SLATEDB_BENCH_BUCKET is required}"
          export SLATEDB_BENCH_PREFIX=${SLATEDB_BENCH_PREFIX:-benchmark}
          export SLATEDB_BENCH_RUNNER_TYPE=${SLATEDB_BENCH_RUNNER_TYPE:-warp-ubuntu-latest-arm64-32x}
          SLATEDB_BENCH_RUNNER_REGION=$(
            curl --fail --location --silent --show-error --max-time 10 https://ipinfo.io/json |
              jq -r '[.city, .region, .country] | map(select(length > 0)) | join(", ")' ||
              true
          )
          export SLATEDB_BENCH_RUNNER_REGION
          bin/slatedb-benchmark run \
            --workload "$BENCHMARK_TASK" \
            --golden "$GOLDEN_ID" \
            --session "$BENCHMARK_SESSION" \
            --scale "$BENCHMARK_SCALE" \
            --output ".runs/workload/$BENCHMARK_TASK"
      - name: Preserve workload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workload-${{ matrix.task }}
          path: .runs/workload
          if-no-files-found: ignore
          overwrite: true

  bundle:
    needs: [validate-golden, build, workloads]
    runs-on: warp-ubuntu-latest-arm64-16x
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: golden-manifest
          path: .runs/bundle
      - uses: actions/download-artifact@v4
        with:
          pattern: workload-*
          path: .runs/bundle/workload
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-runner
          path: bin
      - run: chmod +x bin/slatedb-benchmark
      - name: Assemble release bundle
        env:
          BENCHMARK_STARTED_AT: ${{ needs.validate-golden.outputs.started_at }}
          GOLDEN_ID: ${{ inputs.golden_id }}
        run: |
          bin/slatedb-benchmark bundle \
            --input .runs/bundle \
            --output .runs/release/results \
            --golden "$GOLDEN_ID" \
            --started-at "$BENCHMARK_STARTED_AT"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: .runs/release/results
          if-no-files-found: error
          overwrite: true

  publish:
    needs: bundle
    runs-on: warp-ubuntu-latest-arm64-16x
    permissions:
      actions: write
      contents: write
    concurrency:
      group: benchmark-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: .runs/release/results
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-runner
          path: bin
      - run: chmod +x bin/slatedb-benchmark
      - name: Check out current main for publication
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: publish
      - name: Publish benchmark results
        id: publication
        shell: bash
        run: |
          bin/slatedb-benchmark publish \
            --bundle .runs/release/results \
            --checkout publish
          echo "sha=$(git -C publish rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Deploy benchmark website
        uses: actions/github-script@v9
        env:
          PUBLICATION_SHA: ${{ steps.publication.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "pages.yml",
              ref: "main",
              inputs: {
                publication_sha: process.env.PUBLICATION_SHA,
              },
            });

  cleanup:
    needs: publish
    runs-on: warp-ubuntu-latest-arm64-16x
    environment: benchmark-${{ inputs.object_store }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-runner
          path: bin
      - run: chmod +x bin/slatedb-benchmark
      - name: Configure S3 credentials
        if: ${{ inputs.object_store == 's3' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure Tigris credentials
        if: ${{ inputs.object_store == 'tigris' }}
        shell: bash
        env:
          AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${TIGRIS_ACCESS_KEY_ID:?Tigris access key ID is required}"
          : "${TIGRIS_SECRET_ACCESS_KEY:?Tigris secret access key is required}"
          {
            echo "AWS_ACCESS_KEY_ID=$TIGRIS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$TIGRIS_SECRET_ACCESS_KEY"
            echo "AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3:-https://t3.storage.dev}"
          } >> "$GITHUB_ENV"
      - name: Delete benchmark session data
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          CLOUD_PROVIDER: ${{ inputs.object_store }}
          SLATEDB_BENCH_BUCKET: ${{ vars.SLATEDB_BENCH_BUCKET }}
        run: |
          set -euo pipefail
          : "${SLATEDB_BENCH_BUCKET:?SLATEDB_BENCH_BUCKET is required}"
          export SLATEDB_BENCH_PREFIX=${SLATEDB_BENCH_PREFIX:-benchmark}
          bin/slatedb-benchmark cleanup --session "github-${{ github.run_id }}"
