name: Measure transfer capacity

on:
  workflow_dispatch:
    inputs:
      object_store:
        description: Object store
        required: true
        default: s3
        type: choice
        options:
          - s3
          - tigris
      scale:
        description: Decimal scale factor
        required: true
        default: "1.0"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: transfer-capacity-${{ inputs.object_store }}
  cancel-in-progress: false

jobs:
  transfer-capacity:
    runs-on: warp-ubuntu-latest-arm64-8x
    timeout-minutes: 60
    environment: benchmark-${{ inputs.object_store }}
    env:
      WARP_VERSION: v1.5.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.9
          cache: false
      - name: Install Warp
        shell: bash
        run: |
          set -euo pipefail
          warp_bin_dir="${RUNNER_TEMP:-/tmp}/warp-bin"
          mkdir -p "$warp_bin_dir"
          GOBIN="$warp_bin_dir" go install "github.com/minio/warp@${WARP_VERSION}"
          echo "$warp_bin_dir" >> "$GITHUB_PATH"
          "$warp_bin_dir/warp" --version
      - name: Configure S3 credentials
        if: ${{ inputs.object_store == 's3' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure Tigris credentials
        if: ${{ inputs.object_store == 'tigris' }}
        shell: bash
        env:
          AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${TIGRIS_ACCESS_KEY_ID:?Tigris access key ID is required}"
          : "${TIGRIS_SECRET_ACCESS_KEY:?Tigris secret access key is required}"
          {
            echo "AWS_ACCESS_KEY_ID=$TIGRIS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$TIGRIS_SECRET_ACCESS_KEY"
            echo "AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3:-https://t3.storage.dev}"
          } >> "$GITHUB_ENV"
      - name: Install runner diagnostics
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v traceroute >/dev/null 2>&1 || \
            ! command -v mtr >/dev/null 2>&1; then
            if ! sudo apt-get update -qq || \
              ! sudo apt-get install -y --no-install-recommends traceroute mtr-tiny; then
              echo "::warning::network diagnostics installation failed"
            fi
          fi
      - name: Record runner diagnostics
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          CLOUD_PROVIDER: ${{ inputs.object_store }}
        run: |
          set -uo pipefail

          echo "::group::Host"
          hostname
          uname -a
          cat /etc/os-release
          systemd-detect-virt || true
          for field in sys_vendor product_name; do
            if [[ -r /sys/devices/virtual/dmi/id/$field ]]; then
              printf '%s: ' "$field"
              cat "/sys/devices/virtual/dmi/id/$field"
            fi
          done
          echo "::endgroup::"

          echo "::group::CPU"
          lscpu
          echo "::endgroup::"

          echo "::group::Memory"
          free -h
          echo "::endgroup::"

          echo "::group::Disk"
          lsblk -o NAME,MODEL,SIZE,TYPE,FSTYPE,MOUNTPOINTS
          df -h
          du -sh "$GITHUB_WORKSPACE"
          echo "::endgroup::"

          echo "::group::Network"
          if command -v ip >/dev/null 2>&1; then
            ip -brief address
            ip route
          else
            echo "::warning::ip command unavailable"
          fi
          echo "Public egress:"
          public_egress=$(curl --fail --location --silent --show-error --max-time 10 \
            https://ipinfo.io/json || true)
          printf '%s\n' "$public_egress"
          runner_region=$(jq -r '
            [.city, .region, .country]
            | map(select(type == "string" and length > 0))
            | join(", ")
          ' <<< "$public_egress" 2>/dev/null || true)
          if [[ -n "$runner_region" ]]; then
            echo "SLATEDB_BENCH_RUNNER_REGION=$runner_region" >> "$GITHUB_ENV"
          fi
          echo
          if [[ "$CLOUD_PROVIDER" == tigris ]]; then
            object_store_name=Tigris
            object_store_host=${AWS_ENDPOINT_URL_S3#*://}
            object_store_host=${object_store_host%%/*}
          else
            object_store_name="Amazon S3"
            object_store_host="s3.${AWS_REGION}.amazonaws.com"
          fi
          echo "$object_store_name DNS:"
          getent ahosts "$object_store_host" || true
          echo "$object_store_name connection:"
          curl --location --silent --show-error --max-time 20 \
            --output /dev/null \
            --write-out 'remote_ip=%{remote_ip} http_code=%{http_code} connect_seconds=%{time_connect} tls_seconds=%{time_appconnect} total_seconds=%{time_total}\n' \
            "https://$object_store_host" || true
          echo "::endgroup::"

          echo "::group::TCP traceroute to $object_store_name"
          sudo traceroute -T -p 443 -m 20 -w 2 -q 1 "$object_store_host" || true
          echo "::endgroup::"

          echo "::group::MTR packet loss to $object_store_name"
          if command -v mtr >/dev/null 2>&1; then
            sudo mtr \
              --report \
              --report-wide \
              --report-cycles 20 \
              --tcp \
              --port 443 \
              --show-ips \
              "$object_store_host" || true
          else
            echo "::warning::mtr command unavailable"
          fi
          echo "::endgroup::"
      - name: Measure object store transfer capacity
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          BENCHMARK_ACTIONS_JOB_ID: ${{ job.check_run_id }}
          BENCHMARK_SCALE: ${{ inputs.scale }}
          CLOUD_PROVIDER: ${{ inputs.object_store }}
          SLATEDB_BENCH_BUCKET: ${{ vars.SLATEDB_BENCH_BUCKET }}
          SLATEDB_BENCH_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          export BENCHMARK_ACTIONS_LOG_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/job/$BENCHMARK_ACTIONS_JOB_ID"
          unset BENCHMARK_ACTIONS_JOB_ID
          : "${SLATEDB_BENCH_BUCKET:?SLATEDB_BENCH_BUCKET is required}"
          export SLATEDB_BENCH_PREFIX=${SLATEDB_BENCH_PREFIX:-benchmark}
          export SLATEDB_BENCH_RUNNER_TYPE=${SLATEDB_BENCH_RUNNER_TYPE:-warp-ubuntu-latest-arm64-8x}
          ./scripts/transfer-capacity.sh .runs/transfer-capacity/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: transfer-capacity
          path: .runs/transfer-capacity
          if-no-files-found: error
          overwrite: true

  publish:
    needs: transfer-capacity
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    concurrency:
      group: benchmark-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: transfer-capacity
          path: .runs/transfer-capacity
      - name: Check out current main for publication
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: publish
      - name: Publish transfer-capacity result
        id: publication
        shell: bash
        env:
          OBJECT_STORE: ${{ inputs.object_store }}
        run: |
          set -euo pipefail
          result=.runs/transfer-capacity/result.json
          run_id=$(jq -er '.run_id' "$result")
          [[ "$run_id" == "github-$GITHUB_RUN_ID" ]]
          destination="publish/results/transfer-capacity/$OBJECT_STORE/$run_id"
          mkdir -p "$destination"
          cp "$result" "$destination/result.json"

          git -C publish config user.name "slatedb-benchmark[bot]"
          git -C publish config user.email "slatedb-benchmark[bot]@users.noreply.github.com"
          git -C publish add "results/transfer-capacity/$OBJECT_STORE/$run_id/result.json"
          if ! git -C publish diff --cached --quiet; then
            git -C publish commit -m "Publish $OBJECT_STORE transfer capacity $run_id"
            for attempt in {1..5}; do
              git -C publish fetch origin main
              git -C publish rebase origin/main
              if git -C publish push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" == 5 ]]; then
                echo "main advanced during all publication attempts" >&2
                exit 1
              fi
            done
          fi
          echo "sha=$(git -C publish rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Deploy benchmark website
        uses: actions/github-script@v7
        env:
          PUBLICATION_SHA: ${{ steps.publication.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "pages.yml",
              ref: "main",
              inputs: {
                publication_sha: process.env.PUBLICATION_SHA,
              },
            });
