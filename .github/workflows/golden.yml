name: Prepare golden data

on:
  workflow_dispatch:
    inputs:
      slatedb_ref:
        description: SlateDB tag, branch, or commit
        required: true
        default: v0.14.1
        type: string
      golden_id:
        description: Immutable golden data name
        required: true
        default: golden
        type: string
      object_store:
        description: Object store
        required: true
        default: s3
        type: choice
        options:
          - s3
          - tigris
      scale:
        description: Decimal scale factor
        required: true
        default: "1.0"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: slatedb-benchmark-${{ inputs.object_store }}-environment
  cancel-in-progress: false

jobs:
  build:
    runs-on: warp-ubuntu-latest-arm64-8x
    outputs:
      slate_version: ${{ steps.source.outputs.version }}
      slate_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Summarize workflow inputs
        shell: bash
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
        run: |
          {
            echo "### Workflow inputs"
            echo
            echo "| Input | Value |"
            echo "| --- | --- |"
            jq -r '
              to_entries[]
              | "| `\(.key)` | `\(.value | tostring | gsub("\\|"; "\\\\|"))` |"
            ' <<< "$WORKFLOW_INPUTS"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: slatedb/slatedb
          ref: ${{ inputs.slatedb_ref }}
          path: .slatedb-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Resolve SlateDB source
        id: source
        shell: bash
        env:
          SLATEDB_REF: ${{ inputs.slatedb_ref }}
        run: |
          set -euo pipefail
          commit=$(git -C .slatedb-source rev-parse HEAD)
          if [[ "$SLATEDB_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            version=${SLATEDB_REF#v}
          else
            version=sha-${commit:0:12}
          fi
          echo "SLATEDB_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "SLATEDB_VERSION=$version" >> "$GITHUB_ENV"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Configure selected SlateDB source
        shell: bash
        run: |
          set -euo pipefail
          cargo add --quiet --path "$GITHUB_WORKSPACE/.slatedb-source/slatedb" \
            --no-default-features --features aws,foyer,wal_disable,zstd
          cargo add --quiet --path "$GITHUB_WORKSPACE/.slatedb-source/slatedb-common" \
            --features serde
      - name: Build runner
        run: cargo build --release --locked
      - name: Preserve runner binary
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-runner
          path: target/release/slatedb-benchmark
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  bulk-load:
    needs: build
    runs-on: warp-ubuntu-latest-arm64-8x
    timeout-minutes: 1440
    environment: benchmark-${{ inputs.object_store }}
    concurrency:
      group: golden-${{ inputs.object_store }}-${{ inputs.golden_id }}-bulk-load
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-runner
          path: bin
      - run: chmod +x bin/slatedb-benchmark
      - name: Configure S3 credentials
        if: ${{ inputs.object_store == 's3' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure Tigris credentials
        if: ${{ inputs.object_store == 'tigris' }}
        shell: bash
        env:
          AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${TIGRIS_ACCESS_KEY_ID:?Tigris access key ID is required}"
          : "${TIGRIS_SECRET_ACCESS_KEY:?Tigris secret access key is required}"
          echo "AWS_ACCESS_KEY_ID=$TIGRIS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$TIGRIS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3:-https://t3.storage.dev}" >> "$GITHUB_ENV"
      - name: Run bulk load
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          BENCHMARK_SCALE: ${{ inputs.scale }}
          CLOUD_PROVIDER: ${{ inputs.object_store }}
          GOLDEN_ID: ${{ inputs.golden_id }}
          SLATEDB_BENCH_BUCKET: ${{ vars.SLATEDB_BENCH_BUCKET }}
          SLATEDB_BENCH_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          : "${SLATEDB_BENCH_BUCKET:?SLATEDB_BENCH_BUCKET is required}"
          export SLATEDB_BENCH_PREFIX=${SLATEDB_BENCH_PREFIX:-benchmark}
          export SLATEDB_BENCH_RUNNER_TYPE=${SLATEDB_BENCH_RUNNER_TYPE:-warp-ubuntu-latest-arm64-8x}
          bin/slatedb-benchmark prepare \
            --phase bulk-load \
            --golden "$GOLDEN_ID" \
            --scale "$BENCHMARK_SCALE" \
            --output .runs/golden/bulk-load
      - name: Preserve bulk-load manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-bulk-load
          path: .runs/golden/bulk-load
          if-no-files-found: ignore
          overwrite: true

  compaction:
    needs: [build, bulk-load]
    runs-on: warp-ubuntu-latest-arm64-8x
    timeout-minutes: 1440
    environment: benchmark-${{ inputs.object_store }}
    concurrency:
      group: golden-${{ inputs.object_store }}-${{ inputs.golden_id }}-compaction
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-runner
          path: bin
      - run: chmod +x bin/slatedb-benchmark
      - name: Configure S3 credentials
        if: ${{ inputs.object_store == 's3' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure Tigris credentials
        if: ${{ inputs.object_store == 'tigris' }}
        shell: bash
        env:
          AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${TIGRIS_ACCESS_KEY_ID:?Tigris access key ID is required}"
          : "${TIGRIS_SECRET_ACCESS_KEY:?Tigris secret access key is required}"
          echo "AWS_ACCESS_KEY_ID=$TIGRIS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$TIGRIS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3:-https://t3.storage.dev}" >> "$GITHUB_ENV"
      - name: Run compaction
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          BENCHMARK_SCALE: ${{ inputs.scale }}
          CLOUD_PROVIDER: ${{ inputs.object_store }}
          GOLDEN_ID: ${{ inputs.golden_id }}
          SLATEDB_BENCH_BUCKET: ${{ vars.SLATEDB_BENCH_BUCKET }}
          SLATEDB_BENCH_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          : "${SLATEDB_BENCH_BUCKET:?SLATEDB_BENCH_BUCKET is required}"
          export SLATEDB_BENCH_PREFIX=${SLATEDB_BENCH_PREFIX:-benchmark}
          export SLATEDB_BENCH_RUNNER_TYPE=${SLATEDB_BENCH_RUNNER_TYPE:-warp-ubuntu-latest-arm64-8x}
          bin/slatedb-benchmark prepare \
            --phase compaction \
            --golden "$GOLDEN_ID" \
            --scale "$BENCHMARK_SCALE" \
            --output .runs/golden/final
      - name: Preserve golden manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-manifest
          path: .runs/golden/final
          if-no-files-found: ignore
          overwrite: true
