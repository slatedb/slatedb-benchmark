name: Prepare golden data

on:
  workflow_dispatch:
    inputs:
      slatedb_ref:
        description: SlateDB tag, branch, or commit
        required: true
        default: v0.14.1
        type: string
      golden_id:
        description: Immutable golden data name
        required: true
        default: golden
        type: string
      object_store:
        description: Object store
        required: true
        default: s3
        type: choice
        options:
          - s3
          - tigris
      scale:
        description: Decimal scale factor
        required: true
        default: "1.0"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: slatedb-benchmark-${{ inputs.object_store }}-environment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      slate_version: ${{ steps.source.outputs.version }}
      slate_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Summarize workflow inputs
        shell: bash
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
        run: |
          {
            echo "### Workflow inputs"
            echo
            echo "| Input | Value |"
            echo "| --- | --- |"
            jq -r '
              to_entries[]
              | "| `\(.key)` | `\(.value | tostring | gsub("\\|"; "\\\\|"))` |"
            ' <<< "$WORKFLOW_INPUTS"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: slatedb/slatedb
          ref: ${{ inputs.slatedb_ref }}
          path: .slatedb-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Apply SlateDB patches
        run: bash scripts/apply-slatedb-patch.sh .slatedb-source
      - name: Resolve SlateDB source
        id: source
        shell: bash
        env:
          SLATEDB_REF: ${{ inputs.slatedb_ref }}
        run: |
          set -euo pipefail
          commit=$(git -C .slatedb-source rev-parse HEAD)
          if [[ "$SLATEDB_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            version=${SLATEDB_REF#v}
          else
            version=sha-${commit:0:12}
          fi
          echo "SLATEDB_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "SLATEDB_VERSION=$version" >> "$GITHUB_ENV"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Configure selected SlateDB source
        shell: bash
        run: |
          set -euo pipefail
          cargo add --quiet --path "$GITHUB_WORKSPACE/.slatedb-source/slatedb" \
            --no-default-features --features aws,foyer,wal_disable,zstd
          cargo add --quiet --path "$GITHUB_WORKSPACE/.slatedb-source/slatedb-common" \
            --features serde
          cargo add --quiet --path "$GITHUB_WORKSPACE/.slatedb-source/slatedb-mirror"
      - name: Build runner
        run: cargo build --release --locked
      - name: Preserve runner binary
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-runner
          path: target/release/slatedb-benchmark
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  start-bulk-load:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: benchmark-${{ inputs.object_store }}
    outputs:
      label: ${{ steps.start-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-runner.outputs.ec2-instance-id }}
      region: ${{ steps.start-runner.outputs.region }}
    steps:
      - name: Configure EC2 launcher credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_EC2_ROLE_ARN }}
          aws-region: ${{ vars.AWS_EC2_REGION }}
      - name: Start EC2 runner
        id: start-runner
        uses: machulav/ec2-github-runner@v2.6.1
        with:
          mode: start
          github-token: ${{ secrets.EC2_RUNNER_GITHUB_TOKEN }}
          use-jit: true
          ec2-instance-type: c7gd.2xlarge
          ec2-volume-size: 20
          ec2-volume-type: gp3
          availability-zones-config: ${{ vars.EC2_AVAILABILITY_ZONES_CONFIG }}
          aws-resource-tags: '[{"Key":"Project","Value":"slatedb-benchmark"},{"Key":"Name","Value":"slatedb-benchmark-golden-bulk-load"}]'
          pre-runner-script: |
            set -euo pipefail
            export HOME=/root
            shutdown -P +1440 || true
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends jq curl ca-certificates git

  bulk-load:
    needs: [build, start-bulk-load]
    runs-on: ${{ needs.start-bulk-load.outputs.label }}
    timeout-minutes: 1440
    environment: benchmark-${{ inputs.object_store }}
    concurrency:
      group: golden-${{ inputs.object_store }}-${{ inputs.golden_id }}-bulk-load
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-runner
          path: bin
      - run: chmod +x bin/slatedb-benchmark
      - name: Configure S3 credentials
        if: ${{ inputs.object_store == 's3' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure Tigris credentials
        if: ${{ inputs.object_store == 'tigris' }}
        shell: bash
        env:
          AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${TIGRIS_ACCESS_KEY_ID:?Tigris access key ID is required}"
          : "${TIGRIS_SECRET_ACCESS_KEY:?Tigris secret access key is required}"
          {
            echo "AWS_ACCESS_KEY_ID=$TIGRIS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$TIGRIS_SECRET_ACCESS_KEY"
            echo "AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3:-https://t3.storage.dev}"
          } >> "$GITHUB_ENV"
      - name: Run bulk load
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          BENCHMARK_SCALE: ${{ inputs.scale }}
          CLOUD_PROVIDER: ${{ inputs.object_store }}
          GOLDEN_ID: ${{ inputs.golden_id }}
          SLATEDB_BENCH_BUCKET: ${{ vars.SLATEDB_BENCH_BUCKET }}
          SLATEDB_BENCH_REGION: ${{ vars.AWS_REGION }}
          SLATEDB_BENCH_RUNNER_TYPE: c7gd.2xlarge
        run: |
          set -euo pipefail
          : "${SLATEDB_BENCH_BUCKET:?SLATEDB_BENCH_BUCKET is required}"
          export SLATEDB_BENCH_PREFIX=${SLATEDB_BENCH_PREFIX:-benchmark}

          bin/slatedb-benchmark prepare \
            --phase bulk-load \
            --golden "$GOLDEN_ID" \
            --scale "$BENCHMARK_SCALE" \
            --output .runs/golden/bulk-load
      - name: Preserve bulk-load manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-bulk-load
          path: .runs/golden/bulk-load
          if-no-files-found: ignore
          overwrite: true

  stop-bulk-load:
    needs: [start-bulk-load, bulk-load]
    if: ${{ always() && needs.start-bulk-load.outputs.ec2-instance-id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: benchmark-${{ inputs.object_store }}
    steps:
      - name: Configure EC2 launcher credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_EC2_ROLE_ARN }}
          aws-region: ${{ needs.start-bulk-load.outputs.region || vars.AWS_EC2_REGION }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2.6.1
        with:
          mode: stop
          github-token: ${{ secrets.EC2_RUNNER_GITHUB_TOKEN }}
          use-jit: true
          label: ${{ needs.start-bulk-load.outputs.label }}
          ec2-instance-id: ${{ needs.start-bulk-load.outputs.ec2-instance-id }}

  start-compaction:
    needs: [build, bulk-load]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: benchmark-${{ inputs.object_store }}
    outputs:
      label: ${{ steps.start-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-runner.outputs.ec2-instance-id }}
      region: ${{ steps.start-runner.outputs.region }}
    steps:
      - name: Configure EC2 launcher credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_EC2_ROLE_ARN }}
          aws-region: ${{ vars.AWS_EC2_REGION }}
      - name: Start EC2 runner
        id: start-runner
        uses: machulav/ec2-github-runner@v2.6.1
        with:
          mode: start
          github-token: ${{ secrets.EC2_RUNNER_GITHUB_TOKEN }}
          use-jit: true
          ec2-instance-type: c7gd.2xlarge
          ec2-volume-size: 20
          ec2-volume-type: gp3
          availability-zones-config: ${{ vars.EC2_AVAILABILITY_ZONES_CONFIG }}
          aws-resource-tags: '[{"Key":"Project","Value":"slatedb-benchmark"},{"Key":"Name","Value":"slatedb-benchmark-golden-compaction"}]'
          pre-runner-script: |
            set -euo pipefail
            export HOME=/root
            shutdown -P +1440 || true
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends jq curl ca-certificates git

  compaction:
    needs: [build, bulk-load, start-compaction]
    runs-on: ${{ needs.start-compaction.outputs.label }}
    timeout-minutes: 1440
    environment: benchmark-${{ inputs.object_store }}
    concurrency:
      group: golden-${{ inputs.object_store }}-${{ inputs.golden_id }}-compaction
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-runner
          path: bin
      - run: chmod +x bin/slatedb-benchmark
      - name: Configure S3 credentials
        if: ${{ inputs.object_store == 's3' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure Tigris credentials
        if: ${{ inputs.object_store == 'tigris' }}
        shell: bash
        env:
          AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${TIGRIS_ACCESS_KEY_ID:?Tigris access key ID is required}"
          : "${TIGRIS_SECRET_ACCESS_KEY:?Tigris secret access key is required}"
          {
            echo "AWS_ACCESS_KEY_ID=$TIGRIS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$TIGRIS_SECRET_ACCESS_KEY"
            echo "AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3:-https://t3.storage.dev}"
          } >> "$GITHUB_ENV"
      - name: Run compaction
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          BENCHMARK_SCALE: ${{ inputs.scale }}
          CLOUD_PROVIDER: ${{ inputs.object_store }}
          GOLDEN_ID: ${{ inputs.golden_id }}
          SLATEDB_BENCH_BUCKET: ${{ vars.SLATEDB_BENCH_BUCKET }}
          SLATEDB_BENCH_REGION: ${{ vars.AWS_REGION }}
          SLATEDB_BENCH_RUNNER_TYPE: c7gd.2xlarge
        run: |
          set -euo pipefail
          : "${SLATEDB_BENCH_BUCKET:?SLATEDB_BENCH_BUCKET is required}"
          export SLATEDB_BENCH_PREFIX=${SLATEDB_BENCH_PREFIX:-benchmark}
          SLATEDB_BENCH_RUNNER_REGION=$(
            curl --fail --location --silent --show-error --max-time 10 https://ipinfo.io/json |
              jq -r '[.city, .region, .country] | map(select(length > 0)) | join(", ")' ||
              true
          )
          export SLATEDB_BENCH_RUNNER_REGION
          bin/slatedb-benchmark prepare \
            --phase compaction \
            --golden "$GOLDEN_ID" \
            --scale "$BENCHMARK_SCALE" \
            --output .runs/golden/final
      - name: Preserve golden manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-manifest
          path: .runs/golden/final
          if-no-files-found: ignore
          overwrite: true

  stop-compaction:
    needs: [start-compaction, compaction]
    if: ${{ always() && needs.start-compaction.outputs.ec2-instance-id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: benchmark-${{ inputs.object_store }}
    steps:
      - name: Configure EC2 launcher credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_EC2_ROLE_ARN }}
          aws-region: ${{ needs.start-compaction.outputs.region || vars.AWS_EC2_REGION }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2.6.1
        with:
          mode: stop
          github-token: ${{ secrets.EC2_RUNNER_GITHUB_TOKEN }}
          use-jit: true
          label: ${{ needs.start-compaction.outputs.label }}
          ec2-instance-id: ${{ needs.start-compaction.outputs.ec2-instance-id }}
